name: CI/CD Pipeline

# Manual only: the "Run workflow" button on the Actions tab is the sole trigger.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/web

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Code Quality — lint + type-check (fast feedback)
  # ═══════════════════════════════════════════════════════════════════════════
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/web && npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run check-types

  # ═══════════════════════════════════════════════════════════════════════════
  # Unit & Integration Tests
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collboard
          POSTGRES_PASSWORD: collboard_ci
          POSTGRES_DB: collboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://collboard:collboard_ci@localhost:5432/collboard_test?schema=public
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & apply migrations
        run: |
          cd apps/web
          npx prisma generate
          npx prisma migrate deploy

      - name: Run tests
        run: cd apps/web && npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # E2E Tests (Playwright)
  # ═══════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collboard
          POSTGRES_PASSWORD: collboard_ci
          POSTGRES_DB: collboard_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://collboard:collboard_ci@localhost:5432/collboard_e2e?schema=public
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client & apply migrations
        run: |
          cd apps/web
          npx prisma generate
          npx prisma migrate deploy

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # Build & Push Docker Image to GHCR
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Higher priority wins the `version` output, which becomes IMAGE_TAG.
            # Without the explicit priority, `latest` (default 200) beats the sha
            # (default 100) and every deploy would overwrite the same mutable tag.
            type=sha,prefix=,priority=300
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: builder
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-migrate
          cache-from: type=gha

  # ═══════════════════════════════════════════════════════════════════════════
  # Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.ref == 'refs/heads/main'

    # Requires manual approval via GitHub Environments
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Keeps the VM's compose config in step with the repo, so editing
      # docker-compose.prod.yml or the Caddyfile takes effect on deploy.
      - name: Sync compose config to the VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/collboard/"

      # NOTE: the heredoc is quoted (<<'ENDSSH') so nothing expands on the
      # runner — IMAGE_TAG is handed to the remote shell on the ssh command
      # line instead. The ENDSSH terminator must stay at this indentation.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd /opt/collboard

          echo "==> Deploying ${IMAGE_TAG}"

          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi

          echo "==> Pulling images"
          docker compose -f docker-compose.prod.yml pull web migrate caddy

          # `docker compose run` and `exec` attach the container to this
          # shell's stdin — which IS the deploy script (ssh feeds it to
          # `bash -s`). Without `< /dev/null` the container swallows every
          # remaining line, bash hits EOF and exits 0, so the step reports
          # success having never restarted anything. `-T` alone does NOT
          # prevent this; the redirect is what matters.
          echo "==> Applying migrations"
          docker compose -f docker-compose.prod.yml run --rm -T migrate < /dev/null

          echo "==> Restarting services"
          docker compose -f docker-compose.prod.yml up -d --no-deps web caddy

          # Port 3000 is not published on the host, so probe inside the container.
          echo "==> Waiting for health check"
          for i in $(seq 1 20); do
            if docker compose -f docker-compose.prod.yml exec -T web \
                 wget --spider -q http://localhost:3000/api/health < /dev/null; then
              echo "Health check passed after $((i * 5))s"
              docker image prune -f
              echo "Deploy complete"
              exit 0
            fi
            sleep 5
          done

          echo "Health check FAILED"
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=80 web
          exit 1
          ENDSSH
